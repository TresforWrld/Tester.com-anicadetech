<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estora Capital Investment — Lusaka, Zambia</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="shared.css">
<style>
:root {
  --navy: #0A1628;
  --gold: #C0A96A;
  --gold-light: #d4c18c;
  --bg: #f4f6f8;
  --bg-white: #ffffff;
}

/* ── COMPACT NAV ── */
nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 60px;
  background: var(--navy);
  height: 70px;
}
.nav-logo img { height: 40px; }
.nav-links { display: flex; gap: 30px; list-style: none; margin: 0; }
.nav-links a { font-size: 12px; text-transform: uppercase; color: #fff; text-decoration: none; font-weight: 600; }
.nav-cta { border: 1px solid var(--gold); padding: 8px 16px; }

/* ── HERO ── */
#hero {
  height: 70vh;
  min-height: 500px;
  display: flex; flex-direction: column; justify-content: center;
  position: relative; overflow: hidden; padding: 0 60px;
}
.hero-bg { position: absolute; inset: 0; }
.hero-slide {
  position: absolute; inset: 0;
  background-position: center 30%;
  background-size: cover;
  background-repeat: no-repeat;
  opacity: 0;
  animation: heroSlideshow 18s ease-in-out infinite;
  transform: scale(1.03);
}
.hero-slide:nth-child(1) { animation-delay: 0s; }
.hero-slide:nth-child(2) { animation-delay: 6s; }
.hero-slide:nth-child(3) { animation-delay: 12s; }
@keyframes heroSlideshow {
  0%   { opacity: 0; transform: scale(1.03); }
  5%   { opacity: 1; }
  30%  { opacity: 1; }
  38%  { opacity: 0; transform: scale(1.07); }
  100% { opacity: 0; transform: scale(1.07); }
}

.hero-gradient {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(to top, rgba(10,22,40,0.8) 0%, rgba(10,22,40,0.2) 100%);
}
.hero-content { position: relative; z-index: 3; width: 100%; max-width: 700px; }
.hero-eyebrow { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.hero-eyebrow-line { width: 40px; height: 1px; background: var(--gold); }
.label { color: var(--gold-light); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.hero-content h1 { font-size: clamp(28px, 4vw, 42px); color: #FFFFFF; margin-bottom: 20px; line-height: 1.2; }
.hero-content h1 em { font-style: italic; color: var(--gold-light); }
.hero-sub { font-size: 15px; color: rgba(255,255,255,0.9); line-height: 1.6; margin-bottom: 30px; }
.hero-btns { display: flex; gap: 15px; }
.btn-primary { background: var(--gold); color: var(--navy); padding: 12px 28px; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.btn-outline { border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 12px 28px; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; }

/* ── MOBILE RESPONSIVENESS ── */
@media (max-width: 768px) {
  nav { padding: 15px 20px; }
  #hero { height: 60vh; padding: 0 20px; align-items: center; text-align: center; }
  .hero-content { background: rgba(10, 22, 40, 0.7); padding: 30px; border-radius: 8px; }
  .hero-content h1 { font-size: 24px; }
  .hero-btns { justify-content: center; flex-direction: column; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo"><img src="assets/logo.png" alt="Estora Capital Investment"></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html" class="nav-cta">Contact</a></li>
  </ul>
</nav>

<section id="hero">
  <div class="hero-bg">
    <div class="hero-slide" style="background-image:url('assets/home-hero-1.jpeg');"></div>
    <div class="hero-slide" style="background-image:url('assets/home-hero-2.jpeg');"></div>
    <div class="hero-slide" style="background-image:url('assets/home-hero-3.jpeg');"></div>
  </div>
  <div class="hero-gradient"></div>
  <div class="hero-content">
    <div class="hero-eyebrow">
      <div class="hero-eyebrow-line"></div>
      <span class="label">Lusaka, Zambia</span>
    </div>
    <h1>Building <em>long-term value</em> through strategic real estate investment</h1>
    <p class="hero-sub">Estora Capital is a Lusaka-based real estate investment firm delivering stable income and long-term capital growth.</p>
    <div class="hero-btns">
      <a href="investment.html" class="btn-primary">View Investments</a>
      <a href="contact.html" class="btn-outline">Partner With Us</a>
    </div>
  </div>
</section>

<script src="shared.js"></script>
</body>
</html>
